<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Security: the page may only load code from itself, Google sign-in and two pinned CDNs, and may only send data to Google, Anthropic and the session server -->

<meta name="referrer" content="no-referrer">

<meta name="apple-mobile-web-app-title" content="Sisyphus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sisyphus</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020D2D">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --abyss:#020D2D;--oxford:#051F48;--silver:#CDCEC8;--fang:#446373;--orko:#D61505;--soda:#F75E3F;
  --text:#F2F2EE;--muted:rgba(205,206,200,.62);--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.14);
  /* Categories: blues, oranges and fuchsias only */
  --trabajo:#F75E3F;--lectura:#FF9A52;--universidad:#5BC8F5;--ejercicio:#3D7BFF;--proyectos:#E0359B;--ocio:#FF6FD0;
  /* Done state: the brand gradient (orange, fuchsia, blue), never a single category or priority colour */
  --done:linear-gradient(135deg,#F75E3F 0%,#C04BD8 52%,#5B8CFF 100%);--done-ink:#FFFFFF;--prio:#D61505;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.01em;
  background:radial-gradient(120% 60% at 100% 0%,#3a0d1e 0%,transparent 55%),radial-gradient(90% 50% at 0% 100%,#0b2a5c 0%,transparent 60%),var(--abyss);
  background-attachment:fixed;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:24px;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
h1{font-weight:500;font-size:40px;line-height:1;letter-spacing:-.04em;margin:24px 0 4px}
.date{color:var(--muted);font-size:14px}
.card{padding:16px 18px;margin:12px 0}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 8px}
.sec h3{margin:0;font-weight:500;font-size:20px;letter-spacing:-.02em}
.pill{display:inline-block;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--edge)}
.pill.live{background:var(--soda);border-color:var(--soda);color:#fff}
.btn{border:1px solid var(--edge);background:var(--glass);border-radius:99px;padding:10px 16px;font-size:14px}
.btn.p{background:linear-gradient(135deg,var(--orko),var(--soda));border:0;color:#fff;font-weight:600}
.btn.w{background:#fff;color:var(--abyss);border:0;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 8px;padding:0 16px;scrollbar-width:none}
.chips button{flex:none;font-size:13px;background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:7px 14px}
.chips button.on{background:var(--silver);color:var(--abyss);border-color:var(--silver)}

/* AI cards */
.ai{position:relative;overflow:hidden}
.ai::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--soda),var(--ocio),#5b8cff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ai .eyebrow{color:#ffb39f}
.alert{background:rgba(214,21,5,.14);border-color:rgba(247,94,63,.5)}

/* Streak */
.streak{position:relative;overflow:hidden;margin:20px 0 12px;padding:18px 20px 22px;border-radius:28px;
  background:linear-gradient(180deg,#0a0f1f 0%,#0a0f1f 45%,#5a1208 78%,var(--soda) 100%);border:1px solid var(--edge)}
.streak::after{content:"";position:absolute;inset:auto -20% -40% -20%;height:70%;background:radial-gradient(50% 60% at 50% 100%,rgba(255,170,90,.75),transparent 70%);pointer-events:none}
.dial{position:absolute;left:50%;top:42px;transform:translateX(-50%);width:260px;height:70px}
.bignum{position:relative;z-index:1;text-align:center;font-size:120px;font-weight:500;line-height:.9;letter-spacing:-.06em;
  background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.streak .bignum{margin-top:48px}
.streak .lbl{position:relative;z-index:1;text-align:center;font-size:15px}
.week{position:relative;z-index:1;display:flex;justify-content:center;gap:8px;margin-top:14px}
.week span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.1);border:1px solid var(--edge)}
.week span.ok{background:#fff;color:var(--abyss);font-weight:700}
.week span.today{box-shadow:0 0 0 2px #fff}
.week span.ice{background:#9fd3ff;color:var(--abyss)}
.mini{display:flex;gap:8px;margin:12px 0}
.mini>div{flex:1;padding:12px;text-align:center;border-radius:18px}
.mini b{display:block;font-size:24px;font-weight:500;letter-spacing:-.04em}
.mini span{font-size:11px;color:var(--muted)}

/* Now */
.now h2{font-weight:500;font-size:26px;letter-spacing:-.03em;margin:12px 0 4px}
.prog{height:4px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--orko),var(--soda))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stat{padding:16px 18px}
.stat b{display:block;font-size:44px;font-weight:500;letter-spacing:-.05em;line-height:1;margin:8px 0 2px}
.stat.hot{background:var(--soda);border-color:var(--soda)}
.stat.hot .eyebrow{color:rgba(255,255,255,.8)}

/* Tasks */
.task{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:8px 0}
.task .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--c)}
.task .body{flex:1;min-width:0}
.task .m{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.prio{color:var(--prio);font-weight:700}
.check{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--edge);background:none;flex:none;display:grid;place-items:center;color:transparent;padding:0;transition:.2s}
.task.done .check{background:var(--done);border:0;color:var(--done-ink)}
.task.done .t{text-decoration:line-through;color:var(--muted)}

/* Bars */
.bal .r{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.bal .r>span:first-child{width:86px}
.track{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.1);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--c)}
.bal .v{width:56px;text-align:right;color:var(--muted)}

/* Calendar */
.days{display:flex;gap:6px;margin:16px 0}
.days button{flex:1;background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:8px 0;font-size:12px}
.days button b{display:block;font-size:18px;font-weight:500}
.days button.on{background:#fff;color:var(--abyss)}
.grid{position:relative;height:1000px;padding-left:52px}
.hr{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.07);font-size:10px;color:var(--muted)}
.hr span{position:absolute;top:-7px;left:0;width:46px;line-height:1.1}
.hr span i{display:block;font-style:normal;opacity:.55}
.ev{position:absolute;left:56px;right:0;border-radius:14px;padding:8px 12px;font-size:13px;overflow:hidden;
  background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.ev b{display:block;font-weight:500}
.ev small{color:var(--muted)}
.ev.tk{left:72px;right:8px;background:var(--c);border:0;color:#fff;cursor:grab;touch-action:none;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:2}
.ev.tk small{color:rgba(255,255,255,.85)}
.ev.gev{left:auto;right:6px;width:46%;background:rgba(14,30,66,.94);border:1px solid rgba(237,239,247,.45);z-index:3;padding:6px 10px}.ev.gev b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.gchip{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(237,239,247,.13);border:1px solid rgba(237,239,247,.4)}
.btn.danger{border-color:rgba(214,21,5,.6);color:#ff8a7a}
.set .btn{white-space:nowrap;flex:none}.set>.date{min-width:0}
.set.acc{align-items:flex-start}.set.acc>.row{flex:none;margin-top:4px}.set.acc .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.set.acc .who>span:last-child{min-width:0;flex:1}
@media (max-width:480px){.set.acc .pill{font-size:0;width:10px;height:10px;padding:0;border-radius:50%}.set.acc .who b{font-size:13px}.set.acc .btn{padding:6px 10px;font-size:12px}}
.set.acc .who.set.acc .who b{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis}.set.acc .date{font-size:12px}
.gav{width:34px;height:34px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--glass)}
.ic.gx{width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);background:none;padding:0;font-size:15px}
.set.about{flex-direction:column;align-items:stretch}.set.about textarea{width:100%;background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:10px 14px;color:inherit;font:inherit;font-size:13px;resize:vertical}
.set.ckey input{flex:1;min-width:0;max-width:240px;background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:9px 14px;color:inherit;font:inherit;font-size:13px}
.empty{text-align:center;color:var(--muted)}.empty p{margin:4px 0 12px}.empty p:last-child{margin-bottom:4px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.set.rt b,.set b{font-weight:500}.set .date{display:block;font-size:12px}
.field input{font:inherit;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:7px 10px;min-width:0;max-width:62%}
.field input[type=time]{max-width:140px}.field .chips{margin:0}
input.num{width:64px;font:inherit;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:6px 8px;text-align:right}
select.sel{font:inherit;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:6px 8px}select.sel option{color:#000}
.steps-list{margin:8px 0 0;padding-left:20px;line-height:1.7}
.addstep{margin-top:10px;gap:8px}.addstep input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);background:none;border:1px dashed var(--edge);border-radius:10px;padding:7px 10px}
.place a.body{color:inherit;text-decoration:none}.ic.star{width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:none;padding:0;font-size:17px;color:var(--muted);flex:none}.ic.star.on{color:#FFB547;border-color:#FFB547}
input.ttl{width:100%;font:inherit;font-size:20px;font-weight:500;color:var(--text);background:none;border:0;border-bottom:1px solid var(--edge);padding:6px 0;margin:4px 0 6px;outline:none}input.ttl:focus{border-color:var(--soda)}
.mail .btn{padding:8px 14px}
.hd i{display:block;font-style:normal;font-size:10px;color:var(--muted)}
.nowline{position:absolute;left:48px;right:0;height:2px;background:var(--soda);z-index:3}
.nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--soda)}

/* Week view */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk .col{display:flex;flex-direction:column;gap:3px;min-height:420px;padding:6px 3px;border-radius:14px;background:var(--glass);border:1px solid var(--edge)}
.wk .col.today{border-color:var(--soda)}
.wk .hd{text-align:center;font-size:11px;color:var(--muted)}
.wk .hd b{display:block;font-size:16px;color:var(--text);font-weight:500}
.wk .load{height:4px;border-radius:4px;margin:4px 2px}
.wk .blk{border-radius:6px;background:color-mix(in srgb,var(--c) 30%,transparent);border-left:2px solid var(--c);font-size:9px;padding:3px;line-height:1.15;overflow:hidden}
.wk .blk.t{background:var(--c);color:#fff;cursor:grab}
.wk .col.over{outline:2px dashed var(--soda)}

/* Focus */
.focus{text-align:center;padding-top:20px}
.ring{position:relative;width:280px;height:280px;margin:24px auto}
.ring svg{position:absolute;inset:0}
.ring .in{position:absolute;inset:0;display:grid;place-content:center}
.ring .in b{font-size:72px;font-weight:500;letter-spacing:-.05em;line-height:1}
.focus h2{font-weight:500;font-size:28px;letter-spacing:-.03em;margin:0 0 6px}

/* Goals / achievements */
.goal .row{justify-content:space-between}
.goal h4{margin:6px 0;font-weight:500;font-size:18px}
.goal ul{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.goal li{padding:4px 0}
.goal li.ok{color:var(--text)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:16px 8px;border-radius:20px}
.badge .ic{font-size:34px}
.badge b{display:block;font-size:12px;font-weight:600;margin-top:6px}
.badge small{font-size:10px;color:var(--muted)}
.badge.lock{opacity:.35;filter:grayscale(1)}
.level{display:flex;align-items:center;gap:14px}
.level .lv{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:28px;font-weight:500;background:linear-gradient(135deg,var(--orko),var(--soda))}

/* Chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:12px}
.chart .c{flex:1;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden}
.chart .c i{display:block;background:var(--c)}
.chart-x{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-top:6px}
.chart-x span{flex:1;text-align:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis .card{margin:0}
.kpis b{display:block;font-size:32px;font-weight:500;letter-spacing:-.04em;margin-top:6px}

/* Review */
.steps{display:flex;gap:6px;margin:16px 0}
.steps i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.15)}
.steps i.on{background:var(--soda)}

/* Settings */
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--edge);font-size:15px;gap:10px}
.set:first-child{border-top:0}
.toggle{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--soda)}.toggle.on::after{left:21px}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom));z-index:10}
.dock .inner{max-width:520px;margin:0 auto}
.capture{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 18px;border-radius:99px;margin-bottom:10px}
.capture input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:16px;outline:none;min-width:0}
.capture input::placeholder{color:var(--muted)}
.capture button{width:42px;height:42px;border-radius:50%;border:0;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--orko),var(--soda))}
.planbox{position:relative}.planbox textarea{width:100%;font:inherit;font-size:15px;line-height:1.45;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:12px 52px 12px 14px;resize:vertical;outline:none}.planbox .mic{position:absolute;right:8px;bottom:12px;width:38px;height:38px;border-radius:50%;background:none;border:1px solid var(--edge);color:var(--text);display:grid;place-items:center}.planbox .mic.on{background:var(--done);border:0;color:#fff;animation:listen 1.2s ease-in-out infinite}
.plansec{border-top:1px solid var(--edge);padding:10px 0}.plansec ul{margin:6px 0 0;padding-left:4px;list-style:none;font-size:14px;line-height:1.6}.plansec li{display:flex;align-items:baseline;gap:6px}.plansec label{gap:8px;font-size:14px;cursor:pointer}.plansec.opts label{margin:4px 0}
.stp.vn{flex-wrap:nowrap}.stp.vn input{flex:1}
/* Timebox: tasks by category on one side, the day in time boxes on the other */
.tb{display:flex;flex-direction:column}
.tbgoals{margin:8px 0 0;padding-left:22px}.tbgoals li{padding:4px 0;font-size:15px}.tbgoals li>span{display:inline-block;width:calc(100% - 40px);vertical-align:middle}.tbgoals .gx{vertical-align:middle;margin-left:6px}
.tbcats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tbcat{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:14px;padding:8px;min-width:0}
.tbcat.off{opacity:.4}
.tbcat .h{display:flex;align-items:center;gap:6px;font-size:12px}.tbcat .h span{margin-left:auto;color:var(--muted)}
.tbit{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:rgba(255,255,255,.07);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:13px}
.tbit b{display:block;font-weight:500;overflow-wrap:anywhere}.tbit small{color:var(--muted);font-size:11px}.tbit.p b::before{content:"● ";color:var(--prio)}
.tbdays{margin:12px 0 4px}.tbdays button{position:relative}.tbdays button i{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:10px;background:var(--soda);color:#fff;border-radius:99px;padding:1px 6px}
.tbgrid{position:relative;margin:14px 0 6px}
.tbl{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.09);font-size:10px;color:var(--muted)}
.tbl.half{border-top:1px dashed rgba(255,255,255,.05)}
.tbl span{position:absolute;top:-7px;left:0}
.tbr{position:absolute;left:40px;right:0;background:color-mix(in srgb,var(--c) 7%,transparent);border-left:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.tbr small{position:absolute;left:8px;bottom:2px;font-size:10px;color:var(--muted)}
.tbbusy{position:absolute;right:2px;width:34%;background:rgba(14,30,66,.94);border:1px solid rgba(237,239,247,.35);border-radius:10px;padding:3px 8px;font-size:11px;overflow:hidden;z-index:2}
.tbbusy b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbbusy small{color:var(--muted);font-size:10px}
.tbbox{position:absolute;left:46px;right:calc(34% + 8px);background:var(--c);color:#fff;border:0;border-radius:10px;padding:3px 10px;text-align:left;font-size:12px;overflow:hidden;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.tbbox b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:600;overflow:hidden;line-height:1.25}.tbbox small{opacity:.88;font-size:10px;white-space:nowrap}
.tbbox.clash{outline:2px solid #fff;outline-offset:1px}
.capture button.mic{flex:none;background:none;border:1px solid var(--edge);color:var(--text);display:grid;place-items:center}
.capture button.mic.on{background:var(--done);border:0;color:#fff;animation:listen 1.2s ease-in-out infinite}
@keyframes listen{0%,100%{box-shadow:0 0 0 0 rgba(192,75,216,.55)}50%{box-shadow:0 0 0 9px rgba(192,75,216,0)}}
nav{display:flex;padding:6px;border-radius:99px}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;padding:10px 0;border-radius:99px}
nav button.on{background:rgba(255,255,255,.12);color:var(--text)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);
  padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .glass{max-width:520px;margin:0 auto;padding:20px;background:rgba(10,18,45,.85);border-radius:28px}
.sheet h3{margin:4px 0 12px;font-weight:500;font-size:22px;letter-spacing:-.02em}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:16px 6px;font-size:13px}
.menu button span{display:block;font-size:24px;margin-bottom:6px}
.field{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--edge);font-size:14px}
.field select{font:inherit;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:6px 8px}
.field select option{color:#000}

/* Reward */
.reward{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40;opacity:0;transition:opacity .25s}
.reward.on{opacity:1}
.reward .box{text-align:center;transform:scale(.7);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.reward.on .box{transform:scale(1)}
.reward svg{width:220px;height:220px;animation:spin 6s linear infinite}
.reward .pts{font-size:56px;font-weight:500;letter-spacing:-.05em;margin-top:-140px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.reward .msg{margin-top:90px;font-size:15px;background:rgba(2,13,45,.75);padding:8px 16px;border-radius:99px;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;max-width:calc(100vw - 32px);white-space:normal!important;text-align:center;z-index:50;transition:.35s;padding:12px 18px;border-radius:99px;font-size:14px;background:rgba(10,18,45,.9);border:1px solid var(--edge);white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.note{font-size:12px;color:var(--muted);text-align:center;margin:28px 0 0}
.sheet .glass{max-height:86vh;overflow:auto}
.stp{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--edge)}
.stp .n{width:18px;flex:none;color:var(--muted);font-size:13px}
.stp input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--edge);border-radius:10px;color:var(--text);font:inherit;font-size:16px;padding:8px 10px;outline:none}
.stp input:focus{border-color:var(--soda)}
.stp select{flex:none;font:inherit;font-size:14px;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:7px 4px}
.stp select option{color:#000}
.stp .ic{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);background:none;font-size:14px;padding:0}
.stp .ic:disabled{opacity:.3}
.lnk{color:var(--soda);text-decoration:none}
/* Habits */
.hab{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--edge)}
.habits .row + .hab{border-top:0}
.hab .hi{font-size:22px;width:28px;text-align:center}
.hs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip-s{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 18%,transparent)}
.hcheck{flex:none;min-width:46px;height:46px;border-radius:23px;border:1.5px solid var(--edge);background:none;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:3px;color:var(--text)}
.hcheck .hx{font-size:13px;font-weight:600}
.hcheck.on{background:var(--done);border:0;color:var(--done-ink)}
/* Focus timer */
.seg.focus-seg{display:flex !important;margin:0 auto 18px;max-width:320px}
.focus-cfg{text-align:left;max-width:440px;margin:20px auto 0}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--edge);font-size:15px}
.stepper:first-child{border-top:0}
.stepper b{min-width:64px;text-align:center;font-weight:500}
.stepper .ic,.focus-cfg .ic{width:32px;height:32px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);font-size:18px;padding:0}
.cycles{display:flex;justify-content:center;gap:8px;margin:-8px 0 16px}
.cycles i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15)}
.cycles i.ok{background:var(--soda)}
.cycles i.now{background:none;box-shadow:0 0 0 2px var(--soda)}
/* Phone: step text on its own line, controls underneath */
.stp{flex-wrap:wrap}
.stp input{flex:1 1 calc(100% - 30px)}
.stp select{margin-left:24px;margin-right:auto}
@media (min-width:900px){ .stp{flex-wrap:nowrap} .stp input{flex:1 1 auto} .stp select{margin:0} }
.quote{position:relative;overflow:hidden;padding:22px 22px 18px;margin:16px 0 4px}
.quote::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(247,94,63,.35),transparent 70%);pointer-events:none}
.quote p{position:relative;font-size:26px;line-height:1.12;letter-spacing:-.035em;font-weight:500;margin:10px 0 12px}
.quote .who{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.quote .who button{border:1px solid var(--edge);background:var(--glass);border-radius:99px;width:32px;height:32px;flex:none}
@media (min-width:900px){.quote p{font-size:34px;max-width:760px}}

/* Navigation: sections + sub-views */
main{position:relative}
.side{display:none}
.avatar{position:absolute;right:16px;top:23px;width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);font-size:16px;z-index:2}
.seg{display:flex;padding:4px;border-radius:99px;margin:20px 54px 0 0;gap:2px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:99px;padding:8px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--abyss);font-weight:600}
nav button.fx,nav button.fx.on{flex:none;width:52px;height:52px;margin:-16px 6px 0;border-radius:50%;padding:0;color:#fff;font-size:22px;
  background:linear-gradient(135deg,var(--orko),var(--soda));box-shadow:0 8px 24px rgba(247,94,63,.45)}
nav button.fx.on{outline:2px solid #fff;outline-offset:2px}
.dash{display:flex;flex-direction:column}
.dash>.colA,.dash>.colB{display:contents}
.goalgrid{display:block}

/* Desktop */
@media (min-width:900px){
  body{padding:0 0 110px 272px}
  .side{display:flex;flex-direction:column;position:fixed;left:12px;top:12px;bottom:12px;width:244px;padding:22px 14px 14px;border-radius:28px;z-index:11;overflow:auto}
  .side .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:500;letter-spacing:-.03em;padding:0 10px 10px}
  .side .logo{width:32px;height:32px;border-radius:9px}
  .side h6{margin:18px 12px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;font-size:14px;cursor:pointer}
  .side a:hover{background:rgba(255,255,255,.06)}
  .side a.on{background:rgba(255,255,255,.13)}
  .side a .n{font-size:11px;background:var(--soda);border-radius:99px;padding:1px 7px;color:#fff}
  .side .foot{margin-top:auto;padding-top:16px}
  main{max-width:1180px;padding:0 32px}
  h1{font-size:52px;margin-top:36px}
  nav,.avatar,.seg{display:none}
  .dock{left:272px;padding:0 32px 16px}
  .dock .inner{max-width:720px}
  .capture{margin:0}
  .dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0 20px;align-items:start;margin-top:8px}
  .dash>.colA,.dash>.colB{display:block}
  .chips{margin:0 0 8px;padding:0;flex-wrap:wrap}
  .wk{gap:8px}.wk .col{min-height:560px;padding:8px 6px}.wk .blk{font-size:12px;padding:6px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .badges{grid-template-columns:repeat(5,1fr)}
  .goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .grid{max-width:760px}
  .tb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0 20px;align-items:start}
  .focus{padding-top:60px}
  .ring{width:340px;height:340px}
  .sheet{left:272px;top:50%;bottom:auto;padding:0 32px;transform:translateY(-45%);opacity:0;pointer-events:none;transition:.25s}
  .sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}
  .toast{left:calc(50% + 136px)}
}
@media (min-width:1400px){ .dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} }
</style>
</head>
<body>
<aside class="side glass" id="side"></aside>
<main id="view"></main>

<div class="dock"><div class="inner">
  <form class="glass capture" id="capture">
    <input id="capIn" placeholder="Escribe una tarea… Claude la organiza" autocomplete="off">
    <button type="button" id="micBtn" class="mic" aria-label="Dictar tareas" onclick="toggleVoice()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button aria-label="Enviar">↑</button>
  </form>
  <nav class="glass">
    <button data-t="hoy">Hoy</button>
    <button data-t="agenda">Agenda</button>
    <button data-t="enfoque" class="fx" aria-label="Enfoque">◉</button>
    <button data-t="planear">Planear</button>
    <button data-t="progreso">Progreso</button>
  </nav>
</div></div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="glass" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script src="google.js?v=1793643148"></script>
<script src="claude.js?v=1793643148"></script>
<div class="reward" id="reward"><div class="box">
  <svg viewBox="-110 -110 220 220" id="burst"></svg>
  <div class="pts" id="rpts">+10 ⭐</div>
  <div class="msg" id="rmsg">¡Bien hecho!</div>
</div></div>

<script src="quotes.js?v=1793643148"></script>
<script src="app.js?v=1793643148"></script>
</body>
